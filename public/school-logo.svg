<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Circular Path for Upper Bengali School Name -->
    <!-- Center (250, 250), radius 208, arc from left to right -->
    <path id="upper-text-path" d="M 45,250 A 205,205 0 1,1 455,250" fill="none" />
    <!-- Circular Path for Lower Sanskrit Motto -->
    <path id="lower-text-path" d="M 100,385 A 210,210 0 0,0 400,385" fill="none" />
  </defs>

  <!-- Background Pure White Disc -->
  <circle cx="250" cy="250" r="242" fill="#ffffff" stroke="#111827" stroke-width="12" />
  <circle cx="250" cy="250" r="232" fill="none" stroke="#111827" stroke-width="3" />

  <!-- Upper Arc Text (Bengali: দেশবন্ধু পল্লী সেবা সংঘ সন্তোষ কুমারী শিক্ষা নিকেতন) -->
  <text font-family="'Plus Jakarta Sans', 'Mukti', 'Bangla', sans-serif" font-size="27" font-weight="900" fill="#0f172a" letter-spacing="1.5">
    <textPath href="#upper-text-path" startOffset="50%" text-anchor="middle">
      দেশবন্ধু পল্লী সেবা সংঘ সন্তোষ কুমারী শিক্ষা নিকেতন
    </textPath>
  </text>

  <!-- Central Red Gear / Cogwheel (Symbolizing Industry, Progress & Science) -->
  <g stroke="#d8231a" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" fill="none">
    <!-- Gear Outline Path (6 prominent teeth) -->
    <path d="
      M 230,120 L 270,120 L 270,152
      A 115,115 0 0,1 328,175
      L 358,154 L 388,184 L 366,213
      A 115,115 0 0,1 380,275
      L 412,284 L 398,326 L 366,326
      A 115,115 0 0,1 328,375
      L 338,406 L 298,422 L 280,394
      A 115,115 0 0,1 220,394
      L 202,422 L 162,406 L 172,375
      A 115,115 0 0,1 134,326
      L 102,326 L 88,284 L 120,275
      A 115,115 0 0,1 134,213
      L 112,184 L 142,154 L 172,175
      A 115,115 0 0,1 230,152
      Z
    " />
    
    <!-- Central Inner Clear Ring -->
    <circle cx="250" cy="275" r="95" stroke="#d8231a" stroke-width="5" fill="#ffffff" />
  </g>

  <!-- Open Book of Knowledge (Red Contours at bottom) -->
  <g stroke="#d8231a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="#ffffff">
    <!-- Left Page Outer & Inner Layers -->
    <path d="M 250,375 C 200,345 150,355 115,372 C 145,392 195,385 250,412 Z" />
    <path d="M 250,390 C 205,365 160,372 120,388" fill="none" stroke-width="4" />
    
    <!-- Right Page Outer & Inner Layers -->
    <path d="M 250,375 C 300,345 350,355 385,372 C 355,392 305,385 250,412 Z" />
    <path d="M 250,390 C 295,365 340,372 380,388" fill="none" stroke-width="4" />
  </g>

  <!-- Pradeep / Diya / Standing Brass Lamp of Enlightenment (Red Linework) -->
  <g stroke="#d8231a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Ribbed Pedestal Column -->
    <path d="M 240,375 L 240,240 Q 240,230 250,230 Q 260,230 260,240 L 260,375" fill="#ffffff" />
    
    <!-- Rib Rings across Column -->
    <ellipse cx="250" cy="250" rx="12" ry="4" stroke-width="4" />
    <ellipse cx="250" cy="265" rx="12" ry="4" stroke-width="4" />
    <ellipse cx="250" cy="280" rx="12" ry="4" stroke-width="4" />
    <ellipse cx="250" cy="295" rx="12" ry="4" stroke-width="4" />
    <ellipse cx="250" cy="310" rx="12" ry="4" stroke-width="4" />
    <ellipse cx="250" cy="325" rx="12" ry="4" stroke-width="4" />
    <ellipse cx="250" cy="340" rx="12" ry="4" stroke-width="4" />
    <ellipse cx="250" cy="355" rx="12" ry="4" stroke-width="4" />

    <!-- Lamp Oil Basin / Bowl at the top -->
    <path d="M 228,225 C 228,205 272,205 272,225 C 272,238 228,238 228,225 Z" fill="#ffffff" stroke-width="6" />
    <path d="M 235,215 C 245,208 278,200 295,190" stroke-width="5" />

    <!-- Radiant Flame / Jyoti (Red with white core) -->
    <path d="M 295,190 C 315,160 305,140 295,130 C 285,145 275,165 295,190 Z" fill="#ffffff" stroke="#d8231a" stroke-width="6" />
    <path d="M 295,178 C 302,165 298,152 295,145 C 291,155 288,168 295,178 Z" fill="#d8231a" stroke="none" />
  </g>

  <!-- Two Red Side Emphatic Dots -->
  <circle cx="102" cy="378" r="8" fill="#d8231a" />
  <circle cx="398" cy="378" r="8" fill="#d8231a" />

  <!-- Lower Motto Text: শ্রদ্ধাবান্ লভতে জ্ঞানম্ (Shraddhavan Labhate Jnanam) -->
  <text font-family="'Plus Jakarta Sans', 'Mukti', 'Bangla', sans-serif" font-size="24" font-weight="900" fill="#0f172a" letter-spacing="1">
    <textPath href="#lower-text-path" startOffset="50%" text-anchor="middle">
      শ্রদ্ধাবান্ লভতে জ্ঞানম্
    </textPath>
  </text>
</svg>
